name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lua test interpreter
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Python root-package, installer, watcher, and lab-admission tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript state and executable Lua tests
        run: node tests/state.test.cjs
  clipboard-qt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Qt test dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Check native clipboard positive control and read-only guard
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QPA_PLATFORMTHEME: ""
        run: |
          c++ -std=c++20 -fPIC -Wall -Wextra tests/clipboard-qt.cpp -o /tmp/hyprveil-clipboard-qt $(pkg-config --cflags --libs Qt6Quick Qt6QuickControls2)
          /tmp/hyprveil-clipboard-qt
