name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lua test interpreter
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Python installer, watcher, and lab-admission tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript state and executable Lua tests
        run: node plugin/tests/state.test.cjs
